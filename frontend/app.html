<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#2556E8">
  <title>名刺管理</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="app-page">
  <div class="app-shell">

    <header class="top-bar">
      <div class="top-bar-left">
        <div class="brand-logo brand-logo-sm">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2.5"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
        </div>
        <div class="top-bar-title-group">
          <div class="top-bar-title" id="tenantName">—</div>
          <div class="top-bar-count" id="cardCount">—</div>
        </div>
      </div>

      <div class="top-bar-right">
        <button class="btn-ghost" id="refreshBtn" title="最新のデータを取得">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          <span class="btn-ghost-label">更新</span>
        </button>
        <button class="btn-ghost" id="switchBtn" title="会社を切り替える">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"/>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
          <span class="btn-ghost-label">会社切替</span>
        </button>
      </div>
    </header>

    <div class="search-wrap">
      <div class="search-field">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="search"
          id="searchInput"
          placeholder="会社名・名前・役職・メモ・タグで検索"
          autocomplete="off"
          spellcheck="false"
        >
        <kbd class="kbd">/</kbd>
      </div>
    </div>

    <div class="filter-row" id="filterRow">
      <button class="chip chip-active" data-filter="all">すべて</button>
      <button class="chip" data-filter="recent">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        最近登録
      </button>
      <button class="chip" data-filter="with-note">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="9" y1="13" x2="15" y2="13"/>
          <line x1="9" y1="17" x2="13" y2="17"/>
        </svg>
        メモあり
      </button>
      <button class="chip" id="dupesBtn" title="重複候補を確認">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="9" r="7"/>
          <circle cx="15" cy="15" r="7"/>
        </svg>
        重複候補
        <span class="chip-count" id="dupesCount" style="display:none">0</span>
      </button>
      <div class="filter-sep"></div>
      <div class="tag-filter-group" id="tagFilterGroup"></div>
      <div class="filter-sep" id="assignedToFilterSep" style="display:none"></div>
      <div class="tag-filter-group" id="assignedToFilterGroup"></div>
    </div>

    <!-- 一括選択バー (v6.5) -->
    <div class="bulk-select-bar" id="bulkSelectBar">
      <button class="bulk-select-btn" id="bulkSelectBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 11 12 14 22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
        <span id="bulkSelectLabel">表示中の全件を選択</span>
      </button>
    </div>

    <main class="main-grid">
      <section class="pane pane-list" id="listPane">
        <div class="skel-list">
          <div class="skel-group-header"></div>
          <div class="skel-row"></div>
          <div class="skel-row"></div>
          <div class="skel-row"></div>
        </div>
      </section>

      <section class="pane pane-detail" id="detailPane">
        <div class="detail-empty">
          <div class="detail-empty-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <line x1="7" y1="10" x2="17" y2="10"/>
              <line x1="7" y1="14" x2="13" y2="14"/>
            </svg>
          </div>
          <p class="detail-empty-text">名刺を選択すると詳細が表示されます</p>
        </div>
      </section>
    </main>

    <div class="mobile-sheet" id="mobileSheet">
      <header class="mobile-sheet-head">
        <button class="btn-ghost" id="mobileBackBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          <span class="btn-ghost-label">戻る</span>
        </button>
      </header>
      <div class="mobile-sheet-body" id="mobileSheetBody"></div>
    </div>
  </div>

  <!-- 選択バー -->
  <div class="selection-bar" id="selectionBar">
    <div class="selection-count"><strong id="selectionCount">0</strong><span class="selection-btn-label">名を選択中</span></div>
    <button class="selection-btn selection-btn-primary" id="sendEmailBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      <span class="selection-btn-label">メール送信</span>
    </button>
    <button class="selection-btn selection-btn-danger" id="bulkDeleteBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      </svg>
      <span class="selection-btn-label">削除</span>
    </button>
    <button class="selection-btn selection-btn-ghost" id="clearSelectionBtn"><span class="selection-btn-label">選択解除</span></button>
  </div>

  <!-- 重複モーダル -->
  <div class="dupe-modal-overlay" id="dupeModalOverlay" style="display:none">
    <div class="dupe-modal">
      <div class="dupe-modal-head">
        <div class="dupe-modal-title">重複候補</div>
        <button class="dupe-modal-close" id="closeDupeModal" aria-label="閉じる">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="dupe-modal-body" id="dupeModalBody"></div>
    </div>
  </div>

  <!-- マージ詳細モーダル -->
  <div class="dupe-modal-overlay" id="mergeModalOverlay" style="display:none">
    <div class="dupe-modal">
      <div class="dupe-modal-head">
        <div class="dupe-modal-title">項目を選んでマージ</div>
        <button class="dupe-modal-close" id="closeMergeModal" aria-label="閉じる">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="dupe-modal-body" id="mergeModalBody"></div>
      <div class="email-modal-footer">
        <div class="email-footer-info">採用する側をクリックして選択</div>
        <div class="email-footer-actions">
          <button class="btn-sm" id="cancelMergeBtn">キャンセル</button>
          <button class="btn-sm btn-sm-primary" id="confirmMergeBtn">マージ実行</button>
        </div>
      </div>
    </div>
  </div>

  <!-- メール送信モーダル -->
  <div class="dupe-modal-overlay" id="emailModalOverlay" style="display:none">
    <div class="dupe-modal email-modal">
      <div class="dupe-modal-head">
        <div class="dupe-modal-title">一括メール送信（差し込み配信）</div>
        <button class="dupe-modal-close" id="closeEmailModal" aria-label="閉じる">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="email-modal-body" id="emailModalBody">
        <div class="email-editor-pane">
          <div class="email-sender-bar" id="emailSenderBar">
            <svg class="email-sender-bar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
            </svg>
            <div class="email-sender-bar-info">
              <div class="email-sender-bar-name" id="senderBarName">—</div>
              <div class="email-sender-bar-email" id="senderBarEmail">—</div>
            </div>
            <button class="email-sender-bar-change" id="openSenderPickerBtn">送信元を変更</button>
          </div>
          <div>
            <div class="email-field-label">件名</div>
            <input type="text" class="email-input" id="emailSubject" placeholder="例: 新製品のご案内">
          </div>
          <div>
            <div class="email-field-label">本文</div>
            <textarea class="email-textarea" id="emailBody" placeholder="{{会社}} {{名前}} 様&#10;&#10;いつもお世話になっております。&#10;..."></textarea>
          </div>
          <div class="email-variables-hint">
            使える変数（クリックで挿入）:
            <code data-var="{{会社}}">{{会社}}</code>
            <code data-var="{{名前}}">{{名前}}</code>
            <code data-var="{{役職}}">{{役職}}</code>
            <code data-var="{{メール}}">{{メール}}</code>
          </div>
        </div>
        <div class="email-preview-pane">
          <div class="email-field-label" style="margin-bottom: 10px;">プレビュー（宛先ごと）</div>
          <div class="email-recipient-list" id="emailRecipientList"></div>
        </div>
      </div>
      <div class="email-modal-footer" id="emailModalFooter">
        <div class="email-footer-info" id="emailFooterInfo">— 名に送信します</div>
        <div class="email-footer-actions">
          <button class="btn-sm" id="cancelEmailBtn">キャンセル</button>
          <button class="btn-sm btn-sm-primary" id="sendEmailConfirmBtn">送信</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 送信元選択モーダル -->
  <div class="dupe-modal-overlay" id="senderModalOverlay" style="display:none">
    <div class="dupe-modal" style="max-width:560px">
      <div class="dupe-modal-head">
        <div class="dupe-modal-title">送信元を選択</div>
        <button class="dupe-modal-close" id="closeSenderModal" aria-label="閉じる">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="dupe-modal-body" id="senderModalBody"></div>
    </div>
  </div>

  <!-- トースト通知 (v6.6) -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- カスタム確認ダイアログ (v6.6) -->
  <div class="confirm-modal-overlay" id="confirmModalOverlay" style="display:none">
    <div class="confirm-modal" id="confirmModal">
      <div class="confirm-modal-icon" id="confirmModalIcon"></div>
      <div class="confirm-modal-title" id="confirmModalTitle"></div>
      <div class="confirm-modal-message" id="confirmModalMessage"></div>
      <div class="confirm-modal-actions">
        <button class="confirm-modal-btn confirm-modal-btn-cancel" id="confirmModalCancel">キャンセル</button>
        <button class="confirm-modal-btn confirm-modal-btn-ok" id="confirmModalOk">OK</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
